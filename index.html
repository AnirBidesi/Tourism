<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f7c90">
  <link rel="manifest" href="manifest.json">
  <title>Tourism ChatGPT Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f2f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #0f7c90;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    #chatbox {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }
    .message {
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      max-width: 70%;
    }
    .user {
      background-color: #d1e7dd;
      align-self: flex-end;
    }
    .bot {
      background-color: #ffffff;
      border: 1px solid #ccc;
      align-self: flex-start;
    }
    #inputArea {
      display: flex;
      padding: 1rem;
      background: white;
      border-top: 1px solid #ccc;
    }
    #userInput {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }
    #sendBtn {
      background: #0f7c90;
      color: white;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 5px;
      margin-left: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Tourism Chat Assistant</header>
  <div id="chatbox" style="display: flex; flex-direction: column;"></div>
  <div id="inputArea">
    <input type="text" id="userInput" placeholder="Ask about places, culture, travel help...">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('userInput');
    const button = document.getElementById('sendBtn');

    function addMessage(content, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = content;
      chatbox.appendChild(msg);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    async function getBotReply(message) {
      return `Exploring: ${message}? Don't miss local food, heritage spots, and guided tours!`;
    }

    button.addEventListener('click', async () => {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      const reply = await getBotReply(text);
      addMessage(reply, 'bot');
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') button.click();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker registered'))
        .catch(error => console.error('Service Worker registration failed:', error));
    }
  </script>
</body>
</html>
